[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trading-industry-portfolio"
version = "0.1.0"
description = "Industry-style quant research + backtest + rolling eval + trading bot skeleton"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="Portfolio User"}]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
